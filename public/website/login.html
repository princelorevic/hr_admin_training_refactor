<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manly Plastics | LMS Login</title>

    <!-- <link rel="icon" href="public/assets/images/Manlylogo.png"> -->
     <link rel="icon" href="public/assets/images/devprince.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="public/css/variables.css">
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/animations.css">

    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 51, 102, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            height: 50px;
            margin-bottom: 20px;
        }

        .login-container h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .login-container p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .login-btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn-submit:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-light);
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }
        
    </style>
</head>
<body class="fade-in">

    <div class="login-container slide-up">
        <!-- <img src="public/assets/images/Manlylogo.png" alt="Manly Plastics Logo" class="login-logo"> -->
         <img src="public/assets/images/devprince.png" alt="Manly Plastics Logo" class="login-logo">
        <h2>Welcome Back</h2>
        <p>Sign in to the Corporate Learning Portal</p>

        <!-- Simulated Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="input-group">
                <i class="bi bi-person"></i>
                <input type="text" id="employeeId" placeholder="Username" required autocomplete="username">
            </div>

            <div class="input-group">
                <i class="bi bi-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                    style="padding-right:45px;"
                >

                <i
                    id="togglePassword"
                    class="bi bi-eye"
                    style="
                        position:absolute;
                        right:15px;
                        left:auto;
                        cursor:pointer;
                        color:#64748b;">
                </i>
            </div>

            <button type="submit" class="login-btn-submit" id="loginBtn"> Sign In </button>
        </form>


        <a href="/index.html" class="back-link"><i class="bi bi-arrow-left"></i> Return to Main Website</a>
    </div>

<script>

const API_BASE_URL =
    (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://hr-admin-training-refactor.onrender.com';

const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");

togglePassword.addEventListener("click", () => {

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        togglePassword.classList.remove("bi-eye");
        togglePassword.classList.add("bi-eye-slash");

    }else{

        passwordInput.type = "password";
        togglePassword.classList.remove("bi-eye-slash");
        togglePassword.classList.add("bi-eye");

    }

});

async function handleLogin(event){

    event.preventDefault();

    const loginBtn = document.getElementById("loginBtn");

    loginBtn.disabled = true;
    loginBtn.innerHTML = "Signing In...";

    const username =
    document.getElementById("employeeId").value.trim();

    const password = passwordInput.value;

    try{

        const response = await fetch(`${API_BASE_URL}/api/login`,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                username,
                password
            })

        });

        const data = await response.json();

        if(!response.ok){

            alert(data.error || "Login Failed.");

            loginBtn.disabled = false;
            loginBtn.innerHTML = "Sign In";

            return;
        }

        localStorage.setItem("userId", data.user.id);
        localStorage.setItem("userName", data.user.name);
        localStorage.setItem("userRole", data.user.role);
        
        // 🛑 SIGURADUHING KINUKUHA NITO ANG industry_assignment MULA SA SERVER RESPONSE
        localStorage.setItem("userDept", data.user.industry_assignment || "No Department Assigned");
        switch(data.user.role){

            case "Trainee":
                window.location.href="../views/trainee/index_trainee.html";
                break;

            case "Admin":
                window.location.href="../index_admin.html";
                break;

            case "Supervisor":
                window.location.href="../views/supervisor/index_supervisor.html";
                break;

            default:
                window.location.href="../index_admin.html";

        }

    }
    catch(error){

        console.error(error);

        alert("Unable to connect to the server.\n\nIf you are using the free Render server, wait around 30–60 seconds and try again.");

        loginBtn.disabled = false;
        loginBtn.innerHTML = "Sign In";

    }

}

</script>

</body>
</html>
