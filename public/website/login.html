    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 51, 102, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            height: 50px;
            margin-bottom: 20px;
        }

        .login-container h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .login-container p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .login-btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn-submit:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-light);
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }
        
    </style>
</head>
<body class="fade-in">

    <div class="login-container slide-up">
        <img src="public/assets/images/Manlylogo.png" alt="Manly Plastics Logo" class="login-logo">
        <h2>Welcome Back</h2>
        <p>Sign in to the Corporate Learning Portal</p>

        <!-- Simulated Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="input-group">
                <i class="bi bi-person"></i>
                <input type="text" id="employeeId" placeholder="Email" required autocomplete="username">
            </div>

            <div class="input-group">
                <i class="bi bi-lock"></i>
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn-submit">Sign In</button>
        </form>


        <a href="/index.html" class="back-link"><i class="bi bi-arrow-left"></i> Return to Main Website</a>
    </div>

     <script> //REAL CODESSSSSSSSSSSSSSSSSSSSSSSSSSS
        async function handleLogin(event) {
            // 1. Pipigilan ang pag-refresh ng page na galing sa unang function mo
            event.preventDefault(); 
            
            // 2. Kukunin ang laman ng inputs
            const email = document.getElementById('employeeId').value;
            const password = document.getElementById('password').value;

            try {
                // 3. Ikokonekta sa backend na galing sa pangalawang function mo
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Login failed');
                    return;
                }

                // Tagumpay ang login! I-save ang user info sa LocalStorage
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('userName', data.user.name);
                localStorage.setItem('userRole', data.user.role);

                // I-route ang user base sa kanilang Role
                if (data.user.role === 'Trainee') {
                    window.location.href = '../views/trainee/index_trainee.html';
                } else if (data.user.role === 'Admin') {
                    window.location.href = '../index_admin.html';
                } else {
                    // Fallback para sa HR o ibang role
                    window.location.href = '../index_admin.html';
                }
                
            } catch (error) {
                console.error('Error during login:', error);
                alert('Cannot connect to the server.');
            }
        }
    </script>
